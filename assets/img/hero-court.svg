<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration of a platform tennis court at dusk in winter, with two players mid-rally under string lights, surrounded by snow-dusted evergreen trees.">
  <!--
    PHOTO SLOT: This is original SVG art standing in for a real photo.
    To swap in an actual clinic/court photo, replace the entire <svg> reference
    in index.html's .hero-media with:
      <img src="assets/img/hero-photo.jpg" alt="..." />
    Recommended real photo: wide landscape, >=1920px wide, platform tennis
    court at dusk/night, winter setting.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1A33"/>
      <stop offset="45%" stop-color="#12305C"/>
      <stop offset="100%" stop-color="#1B4A78"/>
    </linearGradient>
    <linearGradient id="snowGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7EEF6"/>
      <stop offset="100%" stop-color="#C8D5E4"/>
    </linearGradient>
    <radialGradient id="heaterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deckWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A1E"/>
      <stop offset="100%" stop-color="#241A12"/>
    </linearGradient>
    <linearGradient id="plankGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8B84B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="treeLit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#123156"/>
      <stop offset="100%" stop-color="#0A1E38"/>
    </linearGradient>
    <linearGradient id="jacketA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B4A78"/>
      <stop offset="100%" stop-color="#0E2C4F"/>
    </linearGradient>
    <linearGradient id="jacketB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#228559"/>
      <stop offset="100%" stop-color="#155C3D"/>
    </linearGradient>
    <radialGradient id="courtShade" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2A8F5E"/>
      <stop offset="100%" stop-color="#1B6B45"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- moon -->
  <circle cx="1330" cy="150" r="46" fill="#F4F0E4" opacity="0.9"/>
  <circle cx="1330" cy="150" r="70" fill="#F4F0E4" opacity="0.08"/>

  <!-- stars -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="120" cy="90" r="1.6"/>
    <circle cx="260" cy="160" r="1.2"/>
    <circle cx="420" cy="70" r="1.8"/>
    <circle cx="610" cy="130" r="1.3"/>
    <circle cx="760" cy="60" r="1.5"/>
    <circle cx="980" cy="110" r="1.2"/>
    <circle cx="1120" cy="60" r="1.6"/>
    <circle cx="60" cy="220" r="1.2"/>
    <circle cx="1480" cy="90" r="1.4"/>
    <circle cx="1550" cy="200" r="1.2"/>
  </g>

  <!-- distant tree line -->
  <g fill="#0F2A4A" opacity="0.75">
    <path d="M0 430 L40 340 L80 430 Z"/>
    <path d="M60 430 L110 300 L160 430 Z"/>
    <path d="M140 430 L180 360 L220 430 Z"/>
    <path d="M1400 430 L1440 350 L1480 430 Z"/>
    <path d="M1450 430 L1500 300 L1550 430 Z"/>
    <path d="M1520 430 L1560 360 L1600 430 Z"/>
  </g>

  <!-- snow-dusted evergreens, closer / larger, flanking the court, two-tone shading -->
  <g id="evergreen-left" transform="translate(140,270)">
    <path d="M0 260 L-70 260 L-30 190 L-62 190 L-24 130 L-50 130 L0 40 L50 130 L24 130 L62 190 L30 190 L70 260 Z" fill="url(#treeLit)"/>
    <path d="M0 40 L0 260 L-70 260 L-30 190 L-62 190 L-24 130 L-50 130 Z" fill="#081A30" opacity="0.55"/>
    <path d="M0 40 L18 85 L-18 85 Z" fill="#DCE6F0" opacity="0.9"/>
    <path d="M-50 130 L-30 165 L-8 130 Z" fill="#DCE6F0" opacity="0.75"/>
    <path d="M8 130 L30 165 L50 130 Z" fill="#DCE6F0" opacity="0.75"/>
    <path d="M-62 190 L-40 222 L-16 190 Z" fill="#DCE6F0" opacity="0.6"/>
    <rect x="-10" y="255" width="20" height="26" fill="#241A12"/>
  </g>
  <g id="evergreen-right" transform="translate(1440,300) scale(-1,1)">
    <path d="M0 240 L-64 240 L-28 175 L-56 175 L-22 118 L-46 118 L0 36 L46 118 L22 118 L56 175 L28 175 L64 240 Z" fill="url(#treeLit)"/>
    <path d="M0 36 L0 240 L-64 240 L-28 175 L-56 175 L-22 118 L-46 118 Z" fill="#081A30" opacity="0.5"/>
    <path d="M0 36 L16 78 L-16 78 Z" fill="#DCE6F0" opacity="0.9"/>
    <path d="M-46 118 L-26 148 L-6 118 Z" fill="#DCE6F0" opacity="0.7"/>
    <rect x="-9" y="236" width="18" height="24" fill="#241A12"/>
  </g>
  <g transform="translate(1520,340) scale(0.7)">
    <path d="M0 240 L-64 240 L-28 175 L-56 175 L-22 118 L-46 118 L0 36 L46 118 L22 118 L56 175 L28 175 L64 240 Z" fill="#0C2340" opacity="0.9"/>
    <path d="M0 36 L14 70 L-14 70 Z" fill="#DCE6F0" opacity="0.75"/>
  </g>
  <g transform="translate(60,340) scale(0.6)">
    <path d="M0 240 L-64 240 L-28 175 L-56 175 L-22 118 L-46 118 L0 36 L46 118 L22 118 L56 175 L28 175 L64 240 Z" fill="#0C2340" opacity="0.9"/>
    <path d="M0 36 L14 70 L-14 70 Z" fill="#DCE6F0" opacity="0.75"/>
  </g>

  <!-- ground snow -->
  <rect x="0" y="760" width="1600" height="140" fill="url(#snowGround)"/>
  <path d="M0 760 Q 400 730 800 758 T 1600 755 L1600 900 L0 900 Z" fill="url(#snowGround)"/>
  <path d="M0 772 Q 400 748 800 770 T 1600 768" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>

  <!-- elevated deck -->
  <rect x="180" y="560" width="1240" height="200" fill="url(#deckWood)"/>
  <g stroke="#4A3826" stroke-width="2" opacity="0.5">
    <line x1="180" y1="590" x2="1420" y2="590"/>
    <line x1="180" y1="630" x2="1420" y2="630"/>
    <line x1="180" y1="670" x2="1420" y2="670"/>
    <line x1="180" y1="710" x2="1420" y2="710"/>
  </g>
  <rect x="180" y="560" width="1240" height="200" fill="url(#plankGlow)"/>
  <!-- deck support posts -->
  <rect x="210" y="760" width="18" height="90" fill="#241A12"/>
  <rect x="1372" y="760" width="18" height="90" fill="#241A12"/>
  <rect x="780" y="760" width="18" height="90" fill="#241A12"/>

  <!-- court playing surface -->
  <rect x="260" y="600" width="1080" height="150" rx="6" fill="url(#courtShade)"/>
  <rect x="260" y="600" width="1080" height="150" rx="6" fill="none" stroke="#EFE7D2" stroke-width="4"/>
  <line x1="800" y1="600" x2="800" y2="750" stroke="#EFE7D2" stroke-width="3" opacity="0.85"/>
  <line x1="530" y1="600" x2="530" y2="750" stroke="#EFE7D2" stroke-width="2.5" opacity="0.6"/>
  <line x1="1070" y1="600" x2="1070" y2="750" stroke="#EFE7D2" stroke-width="2.5" opacity="0.6"/>

  <!-- wire screening around deck -->
  <g stroke="#8A97A8" stroke-width="1" opacity="0.35">
    <line x1="180" y1="470" x2="180" y2="600"/>
    <line x1="1420" y1="470" x2="1420" y2="600"/>
    <line x1="180" y1="470" x2="1420" y2="470"/>
    <path d="M180 470 L1420 470 M180 500 L1420 500 M180 530 L1420 530 M180 560 L1420 560"/>
    <path d="M220 470 L220 600 M300 470 L300 600 M380 470 L380 600 M460 470 L460 600 M540 470 L540 600 M620 470 L620 600 M700 470 L700 600 M780 470 L780 600 M860 470 L860 600 M940 470 L940 600 M1020 470 L1020 600 M1100 470 L1100 600 M1180 470 L1180 600 M1260 470 L1260 600 M1340 470 L1340 600"/>
  </g>
  <path d="M180 470 L1420 470" stroke="#EFE7D2" stroke-width="2" opacity="0.25"/>

  <!-- net -->
  <g>
    <rect x="795" y="612" width="10" height="80" fill="#0B2545"/>
    <rect x="680" y="612" width="240" height="46" fill="#0E2C4F" opacity="0.85"/>
    <g stroke="#EFE7D2" stroke-width="0.6" opacity="0.5">
      <path d="M680 620 L920 620 M680 630 L920 630 M680 640 L920 640 M680 650 L920 650"/>
      <path d="M700 612 L700 658 M720 612 L720 658 M740 612 L740 658 M760 612 L760 658 M780 612 L780 658 M800 612 L800 658 M820 612 L820 658 M840 612 L840 658 M860 612 L860 658 M880 612 L880 658 M900 612 L900 658"/>
    </g>
    <rect x="675" y="606" width="250" height="6" fill="#EFE7D2"/>
    <rect x="675" y="606" width="250" height="3" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- string lights across the deck -->
  <path d="M200 500 Q 800 430 1400 500" fill="none" stroke="#5A4A34" stroke-width="2" opacity="0.6"/>
  <g fill="#E8B84B">
    <circle cx="280" cy="492" r="5"/>
    <circle cx="420" cy="470" r="5"/>
    <circle cx="560" cy="452" r="5"/>
    <circle cx="700" cy="440" r="5"/>
    <circle cx="840" cy="435" r="5"/>
    <circle cx="980" cy="438" r="5"/>
    <circle cx="1120" cy="450" r="5"/>
    <circle cx="1260" cy="468" r="5"/>
    <circle cx="1380" cy="490" r="5"/>
  </g>
  <g fill="url(#heaterGlow)">
    <circle cx="280" cy="492" r="26"/>
    <circle cx="700" cy="440" r="30"/>
    <circle cx="1120" cy="450" r="28"/>
    <circle cx="1380" cy="490" r="26"/>
  </g>

  <!-- heater glow under deck -->
  <ellipse cx="800" cy="700" rx="420" ry="90" fill="url(#heaterGlow)" opacity="0.5"/>

  <!-- ball motion trail -->
  <g fill="#E8B84B" opacity="0.35">
    <circle cx="760" cy="500" r="3"/>
    <circle cx="785" cy="486" r="3.6"/>
    <circle cx="805" cy="476" r="4.4"/>
  </g>

  <!-- player silhouettes, mid-rally, two-tone shaded -->
  <g id="player-left" transform="translate(560,560)">
    <ellipse cx="0" cy="184" rx="34" ry="8" fill="#07182F" opacity="0.35"/>
    <!-- legs -->
    <path d="M-6 96 L-18 178 L-4 178 L4 118 L14 178 L28 178 L14 96 Z" fill="#0E2C4F"/>
    <!-- shoes -->
    <path d="M-22 178 L-2 178 L-2 186 L-26 186 Z" fill="#07182F"/>
    <path d="M10 178 L32 178 L32 186 L14 186 Z" fill="#07182F"/>
    <!-- torso -->
    <path d="M-20 40 Q0 26 20 40 L18 100 Q0 112 -18 100 Z" fill="url(#jacketA)"/>
    <path d="M0 26 Q10 30 20 40 L18 100 Q9 108 0 110 Z" fill="#0A2140" opacity="0.5"/>
    <!-- head -->
    <circle cx="0" cy="18" r="16" fill="#1B4A78"/>
    <!-- back arm -->
    <path d="M-18 50 L-46 30" stroke="url(#jacketA)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-46" cy="30" r="7" fill="#1B4A78"/>
    <!-- paddle arm, raised for a shot -->
    <path d="M18 48 L52 8" stroke="url(#jacketA)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="52" cy="8" r="7" fill="#1B4A78"/>
    <g transform="translate(52,8) rotate(-35)">
      <ellipse cx="18" cy="0" rx="20" ry="14" fill="none" stroke="#E8B84B" stroke-width="4"/>
      <path d="M4 -10 Q18 -14 32 -10 M4 10 Q18 14 32 10" stroke="#E8B84B" stroke-width="1" opacity="0.5" fill="none"/>
      <rect x="-14" y="-3" width="18" height="6" rx="3" fill="#E8B84B"/>
    </g>
  </g>

  <g id="player-right" transform="translate(1040,570) scale(-1,1)">
    <ellipse cx="0" cy="180" rx="32" ry="8" fill="#07182F" opacity="0.35"/>
    <path d="M-6 92 L-16 172 L-2 172 L4 114 L14 172 L26 172 L12 92 Z" fill="#0E2C4F"/>
    <path d="M-20 172 L-1 172 L-1 180 L-24 180 Z" fill="#07182F"/>
    <path d="M9 172 L29 172 L29 180 L12 180 Z" fill="#07182F"/>
    <path d="M-18 38 Q0 24 18 38 L16 96 Q0 108 -16 96 Z" fill="url(#jacketB)"/>
    <path d="M0 24 Q9 28 18 38 L16 96 Q8 104 0 106 Z" fill="#0E3A26" opacity="0.5"/>
    <circle cx="0" cy="16" r="15" fill="#1B4A78"/>
    <path d="M-16 46 L-42 66" stroke="url(#jacketB)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-42" cy="66" r="6.5" fill="#1B4A78"/>
    <path d="M16 44 L44 20" stroke="url(#jacketB)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="44" cy="20" r="6.5" fill="#1B4A78"/>
    <g transform="translate(44,20) rotate(20)">
      <ellipse cx="16" cy="0" rx="18" ry="13" fill="none" stroke="#E8B84B" stroke-width="4"/>
      <path d="M4 -9 Q16 -13 28 -9 M4 9 Q16 13 28 9" stroke="#E8B84B" stroke-width="1" opacity="0.5" fill="none"/>
      <rect x="-12" y="-3" width="16" height="6" rx="3" fill="#E8B84B"/>
    </g>
  </g>

  <!-- ball mid-flight -->
  <circle cx="820" cy="470" r="6" fill="#E8B84B"/>
  <circle cx="820" cy="470" r="9" fill="none" stroke="#E8B84B" stroke-width="1" opacity="0.4"/>

  <!-- falling snow -->
  <g class="snow" fill="#FFFFFF">
    <circle cx="120" cy="120" r="2.4"/>
    <circle cx="340" cy="220" r="1.8"/>
    <circle cx="540" cy="90" r="2.1"/>
    <circle cx="760" cy="180" r="1.6"/>
    <circle cx="980" cy="60" r="2.3"/>
    <circle cx="1180" cy="200" r="1.9"/>
    <circle cx="1380" cy="140" r="2.2"/>
    <circle cx="1540" cy="260" r="1.7"/>
    <circle cx="230" cy="340" r="1.8"/>
    <circle cx="900" cy="320" r="2.0"/>
    <circle cx="60" cy="400" r="1.6"/>
    <circle cx="1260" cy="350" r="1.9"/>
  </g>
</svg>
