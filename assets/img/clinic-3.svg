<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Overhead-style illustration of a platform tennis court with the sport's characteristic wire screening.">
  <!-- PHOTO SLOT: replace with assets/img/clinic-photo-3.jpg (4:3) -->
  <defs>
    <linearGradient id="c3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2743"/>
      <stop offset="100%" stop-color="#1B4A78"/>
    </linearGradient>
    <linearGradient id="c3court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A8F5E"/>
      <stop offset="100%" stop-color="#186B45"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#c3bg)"/>

  <!-- snow patches at the corners -->
  <g fill="#E7EEF6" opacity="0.9">
    <path d="M0 0 L60 0 Q20 20 0 60 Z"/>
    <path d="M480 0 L420 0 Q460 20 480 60 Z"/>
    <path d="M0 360 L60 360 Q20 340 0 300 Z"/>
    <path d="M480 360 L420 360 Q460 340 480 300 Z"/>
  </g>

  <!-- overhead light fixtures -->
  <g fill="#E8B84B" opacity="0.85">
    <circle cx="70" cy="24" r="4"/>
    <circle cx="410" cy="24" r="4"/>
    <circle cx="70" cy="336" r="4"/>
    <circle cx="410" cy="336" r="4"/>
  </g>

  <rect x="40" y="60" width="400" height="240" rx="10" fill="url(#c3court)"/>
  <rect x="40" y="60" width="400" height="240" rx="10" fill="none" stroke="#EFE7D2" stroke-width="5"/>
  <line x1="240" y1="60" x2="240" y2="300" stroke="#EFE7D2" stroke-width="4" opacity="0.85"/>
  <line x1="140" y1="60" x2="140" y2="300" stroke="#EFE7D2" stroke-width="2.5" opacity="0.6"/>
  <line x1="340" y1="60" x2="340" y2="300" stroke="#EFE7D2" stroke-width="2.5" opacity="0.6"/>
  <rect x="230" y="150" width="20" height="60" fill="#0B2545" opacity="0.6"/>

  <!-- wire screening around the perimeter -->
  <g stroke="#E8B84B" stroke-width="1" opacity="0.5">
    <line x1="20" y1="40" x2="20" y2="320"/>
    <line x1="460" y1="40" x2="460" y2="320"/>
    <path d="M20 40 L460 40 M20 320 L460 320"/>
    <path d="M60 40 L60 320 M100 40 L100 320 M180 40 L180 320 M300 40 L300 320 M380 40 L380 320 M420 40 L420 320"/>
  </g>

  <!-- small figures for scale, mid-rally -->
  <g transform="translate(160,190)" opacity="0.92">
    <ellipse cx="0" cy="34" rx="10" ry="3" fill="#07182F" opacity="0.3"/>
    <path d="M-8 8 Q0 2 8 8 L7 28 Q0 33 -7 28 Z" fill="#0B2545"/>
    <circle cx="0" cy="0" r="6" fill="#E8B84B"/>
    <path d="M7 14 L18 6" stroke="#0B2545" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(320,180)" opacity="0.92">
    <ellipse cx="0" cy="34" rx="10" ry="3" fill="#07182F" opacity="0.3"/>
    <path d="M-8 8 Q0 2 8 8 L7 28 Q0 33 -7 28 Z" fill="#1F7A4D"/>
    <circle cx="0" cy="0" r="6" fill="#E8B84B"/>
    <path d="M-7 14 L-18 4" stroke="#1F7A4D" stroke-width="4" stroke-linecap="round"/>
  </g>
  <circle cx="240" cy="150" r="4" fill="#fff"/>
</svg>
