<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Close-up illustration of a platform tennis paddle and ball on the court surface.">
  <!-- PHOTO SLOT: replace with assets/img/clinic-photo-2.jpg (4:3) -->
  <defs>
    <linearGradient id="c2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#12305C"/>
    </linearGradient>
    <linearGradient id="c2court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8F5E"/>
      <stop offset="100%" stop-color="#166643"/>
    </linearGradient>
    <radialGradient id="c2spot" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E8B84B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="360" fill="url(#c2bg)"/>
  <rect x="0" y="220" width="480" height="140" fill="url(#c2court)"/>
  <line x1="0" y1="220" x2="480" y2="220" stroke="#EFE7D2" stroke-width="4" opacity="0.75"/>
  <rect width="480" height="360" fill="url(#c2spot)"/>

  <!-- paddle shadow -->
  <ellipse cx="252" cy="278" rx="72" ry="16" fill="#07182F" opacity="0.28"/>

  <g transform="translate(240,150) rotate(-18)">
    <ellipse cx="0" cy="0" rx="70" ry="50" fill="#0E2C4F" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="70" ry="50" fill="none" stroke="#E8B84B" stroke-width="10"/>
    <ellipse cx="0" cy="0" rx="70" ry="50" fill="none" stroke="#C9962A" stroke-width="2" opacity="0.6"/>
    <g stroke="#E8B84B" stroke-width="1.4" opacity="0.55">
      <line x1="-55" y1="-10" x2="55" y2="-10"/>
      <line x1="-55" y1="10" x2="55" y2="10"/>
      <line x1="-55" y1="30" x2="55" y2="30"/>
      <line x1="-55" y1="-30" x2="55" y2="-30"/>
      <line x1="-10" y1="-48" x2="-10" y2="48"/>
      <line x1="10" y1="-48" x2="10" y2="48"/>
      <line x1="-30" y1="-45" x2="-30" y2="45"/>
      <line x1="30" y1="-45" x2="30" y2="45"/>
    </g>
    <!-- perforation holes, characteristic of a platform tennis paddle -->
    <g fill="#0B2545" opacity="0.7">
      <circle cx="0" cy="0" r="2.6"/>
      <circle cx="-20" cy="0" r="2.4"/>
      <circle cx="20" cy="0" r="2.4"/>
      <circle cx="0" cy="-20" r="2.4"/>
      <circle cx="0" cy="20" r="2.4"/>
      <circle cx="-20" cy="-20" r="2.2"/>
      <circle cx="20" cy="-20" r="2.2"/>
      <circle cx="-20" cy="20" r="2.2"/>
      <circle cx="20" cy="20" r="2.2"/>
    </g>
    <rect x="-14" y="45" width="28" height="70" rx="10" fill="#E8B84B"/>
    <g stroke="#C9962A" stroke-width="1.5" opacity="0.7">
      <line x1="-14" y1="55" x2="14" y2="55"/>
      <line x1="-14" y1="65" x2="14" y2="65"/>
      <line x1="-14" y1="75" x2="14" y2="75"/>
      <line x1="-14" y1="85" x2="14" y2="85"/>
      <line x1="-14" y1="95" x2="14" y2="95"/>
      <line x1="-14" y1="105" x2="14" y2="105"/>
    </g>
  </g>

  <ellipse cx="130" cy="272" rx="18" ry="6" fill="#07182F" opacity="0.25"/>
  <circle cx="130" cy="260" r="16" fill="#fff"/>
  <path d="M118 254 Q130 248 142 254" stroke="#E8B84B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <ellipse cx="370" cy="298" rx="13" ry="4.5" fill="#07182F" opacity="0.2"/>
  <circle cx="370" cy="290" r="12" fill="#fff" opacity="0.85"/>

  <!-- light snow flecks -->
  <g fill="#fff" opacity="0.55">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="410" cy="90" r="1.8"/>
    <circle cx="360" cy="40" r="1.6"/>
  </g>
</svg>
