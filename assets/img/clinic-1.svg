<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Illustration of a coach demonstrating platform tennis technique to a group of middle schoolers on court.">
  <!-- PHOTO SLOT: replace with a real clinic photo, assets/img/clinic-photo-1.jpg (4:3, >=1200px wide) -->
  <defs>
    <linearGradient id="c1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12305C"/>
      <stop offset="70%" stop-color="#1B4A78"/>
      <stop offset="100%" stop-color="#1F7A4D"/>
    </linearGradient>
    <linearGradient id="c1court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A8F5E"/>
      <stop offset="100%" stop-color="#186B45"/>
    </linearGradient>
    <linearGradient id="c1coach" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12305C"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#c1sky)"/>

  <!-- distant tree silhouettes for context -->
  <g fill="#0E2743" opacity="0.6">
    <path d="M20 300 L44 250 L68 300 Z"/>
    <path d="M560 300 L588 244 L616 300 Z"/>
  </g>

  <rect x="0" y="300" width="640" height="180" fill="url(#c1court)"/>
  <rect x="0" y="300" width="640" height="10" fill="#EFE7D2" opacity="0.7"/>
  <line x1="320" y1="300" x2="320" y2="480" stroke="#EFE7D2" stroke-width="2.5" opacity="0.45"/>

  <!-- ball cart, small worldbuilding detail -->
  <g transform="translate(500,330)" opacity="0.9">
    <rect x="0" y="20" width="46" height="30" rx="4" fill="#0B2545"/>
    <circle cx="8" cy="52" r="5" fill="#07182F"/>
    <circle cx="38" cy="52" r="5" fill="#07182F"/>
    <circle cx="14" cy="26" r="5" fill="#EFE7D2"/>
    <circle cx="26" cy="22" r="5" fill="#EFE7D2"/>
    <circle cx="34" cy="30" r="5" fill="#EFE7D2"/>
  </g>

  <!-- coach demonstrating a stroke -->
  <g transform="translate(200,220)">
    <ellipse cx="0" cy="124" rx="22" ry="6" fill="#07182F" opacity="0.3"/>
    <path d="M-6 60 L-14 118 L-2 118 L2 82 L8 118 L20 118 L12 60 Z" fill="#07182F"/>
    <circle cx="0" cy="0" r="20" fill="#E8B84B"/>
    <path d="M-26 30 Q0 16 26 30 L22 88 Q0 100 -22 88 Z" fill="url(#c1coach)"/>
    <path d="M-22 44 L-52 70" stroke="url(#c1coach)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="-52" cy="70" r="6" fill="#E8B84B"/>
    <g transform="translate(-52,70) rotate(20)">
      <ellipse cx="-16" cy="0" rx="18" ry="13" fill="none" stroke="#fff" stroke-width="4"/>
      <rect x="-4" y="-3" width="14" height="6" rx="3" fill="#fff"/>
    </g>
    <path d="M22 44 L50 60" stroke="url(#c1coach)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="50" cy="60" r="6" fill="#E8B84B"/>
  </g>

  <!-- kids, varied heights and poses -->
  <g>
    <g transform="translate(320,262)">
      <ellipse cx="0" cy="94" rx="16" ry="5" fill="#07182F" opacity="0.25"/>
      <circle cx="0" cy="0" r="14" fill="#E8B84B"/>
      <path d="M-16 20 Q0 10 16 20 L14 78 Q0 88 -14 78 Z" fill="#0B2545"/>
      <path d="M14 26 L34 14" stroke="#0B2545" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(372,272)">
      <ellipse cx="0" cy="88" rx="15" ry="5" fill="#07182F" opacity="0.25"/>
      <circle cx="0" cy="0" r="13" fill="#E8B84B"/>
      <path d="M-15 18 Q0 9 15 18 L13 72 Q0 80 -13 72 Z" fill="#1F7A4D"/>
    </g>
    <g transform="translate(418,256)">
      <ellipse cx="0" cy="94" rx="16" ry="5" fill="#07182F" opacity="0.25"/>
      <circle cx="0" cy="0" r="14" fill="#E8B84B"/>
      <path d="M-16 20 Q0 10 16 20 L14 78 Q0 88 -14 78 Z" fill="#0B2545"/>
      <path d="M-14 26 L-34 40" stroke="#0B2545" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(280,278)">
      <ellipse cx="0" cy="80" rx="13" ry="4.5" fill="#07182F" opacity="0.25"/>
      <circle cx="0" cy="0" r="12" fill="#E8B84B"/>
      <path d="M-14 16 Q0 8 14 16 L12 66 Q0 74 -12 66 Z" fill="#1F7A4D"/>
    </g>
    <g transform="translate(456,270)">
      <ellipse cx="0" cy="86" rx="14" ry="4.5" fill="#07182F" opacity="0.25"/>
      <circle cx="0" cy="0" r="12.5" fill="#E8B84B"/>
      <path d="M-14 17 Q0 9 14 17 L12 70 Q0 78 -12 70 Z" fill="#0B2545"/>
    </g>
  </g>

  <!-- ball in flight -->
  <circle cx="255" cy="200" r="7" fill="#fff"/>
  <circle cx="255" cy="200" r="11" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>

  <!-- light snow -->
  <g fill="#fff" opacity="0.7">
    <circle cx="80" cy="80" r="2"/>
    <circle cx="500" cy="60" r="2.4"/>
    <circle cx="600" cy="140" r="1.8"/>
    <circle cx="140" cy="180" r="1.6"/>
  </g>
</svg>
